name: memos_go
description: "MemosGo - a Memos mobile client for iOS and Android"
publish_to: 'none'

version: 1.6.1+8

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^16.0.0

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^10.0.0-beta.4
  shared_preferences: ^2.3.3
  drift: ^2.28.0
  drift_flutter: ^0.2.7
  uuid: ^4.5.1

  # Connectivity (offline sync triggers)
  connectivity_plus: ^7.0.1

  # Content rendering
  flutter_markdown: ^0.7.7
  markdown: ^7.2.2
  characters: ^1.4.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  # Imported for ImageRenderMethodForWeb (not re-exported by cached_network_image).
  cached_network_image_platform_interface: ^4.1.1

  # Misc
  package_info_plus: ^8.1.2
  record: ^7.1.2
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.28.0
  http_mock_adapter: ^0.6.1
  flutter_launcher_icons: ^0.14.3
  flutter_secure_storage_platform_interface: ^2.1.1

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
