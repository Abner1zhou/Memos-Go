# 打 tag（v*）触发：跑测试 → 构建 release APK → 发布 GitHub Release。
# 正式签名需要在仓库 Secrets 配置（见 README「发布」章节），未配置时回退 debug 签名。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | cut -d+ -f1)"
          echo "pubspec.yaml version: $PUBSPEC_VERSION"
          if [ "v$PUBSPEC_VERSION" != "$TAG_NAME" ]; then
            echo "::error::Tag $TAG_NAME 与 pubspec.yaml 版本 $PUBSPEC_VERSION 不一致，请先同步版本号再打 tag"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Restore Android signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置签名 Secrets，本次 APK 回退 debug 签名，仅供测试使用"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "MemosGo-$TAG_NAME.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "MemosGo-$TAG_NAME.apk" --clobber
          else
            gh release create "$TAG_NAME" "MemosGo-$TAG_NAME.apk" --title "$TAG_NAME" --generate-notes
          fi
